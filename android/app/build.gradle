plugins {
    id "com.android.application"
}

android {
    namespace "pk.lastmile.app"
    compileSdk 35

    defaultConfig {
        applicationId "pk.lastmile.app"
        minSdk 24          // Android 7: most cheap phones still in use
        targetSdk 35
        versionCode 1
        versionName "0.1-prototype"
        // The server the app opens by itself: android/server.txt (written by tools/setup_ngrok.ps1), or
        // -PdefaultServer=https://... ; empty = the app asks once on first start.
        def serverFile = rootProject.file("server.txt")
        def server = project.findProperty("defaultServer") ?: (serverFile.exists() ? serverFile.text.trim() : "")
        buildConfigField "String", "DEFAULT_SERVER", "\"${server}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // prototype: installable APK without a keystore
        }
    }
    lint {
        checkReleaseBuilds false   // prototype: a lint warning must not stop the APK
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No libraries: plain Android framework only, so the app stays small (~100 KB) and builds anywhere.
