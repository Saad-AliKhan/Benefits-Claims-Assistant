{% extends "base.html" %}
{% block body %}
<div class="shell">
  <aside class="side">
    <a class="logo" href="/login"><img src="/static/icon.svg" alt=""><b lang="ur">آسرا</b><span>Aasra</span></a>
    <p class="portal">{{ portal }}</p>
    {% block sidenav %}{% endblock %}
    <div class="me"><div id="who"></div><button id="out" type="button" class="link">Sign out</button></div>
  </aside>
  <main class="content">
    <header class="page-head"><h1 id="page-title">{{ heading }}</h1>{% block tools %}{% endblock %}</header>
    {% block content %}{% endblock %}
  </main>
</div>
<div id="toast" role="status" hidden></div>
{% endblock %}
