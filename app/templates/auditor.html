{% extends "staff.html" %}
{% block sidenav %}
  <nav class="tabs" role="tablist" aria-label="Auditor">
    <button type="button" class="chip on" data-tab="eval">Accuracy</button>
    <button type="button" class="chip" data-tab="dec">Decisions</button>
    <button type="button" class="chip" data-tab="log">Audit log</button>
    <button type="button" class="chip" data-tab="cons">Consent records</button>
  </nav>
{% endblock %}
{% block tools %}<span class="chip">Read-only</span>{% endblock %}
{% block content %}
  <section id="eval" class="tab"></section>
  <section id="dec" class="tab" hidden></section>
  <section id="log" class="tab" hidden>
    <form id="log-form" class="inline">
      <input id="f-action" placeholder="Action starts with, e.g. consent. or claim.">
      <select id="f-role"><option value="">Any actor</option><option>citizen</option><option>helper</option><option>officer</option>
        <option>admin</option><option>auditor</option><option>ai</option><option>system</option><option>anonymous</option><option>api_key</option></select>
      <input id="f-case" type="number" min="1" placeholder="Claim number">
      <button class="btn">Filter</button>
    </form>
    <div id="log-list"></div>
  </section>
  <section id="cons" class="tab" hidden></section>
{% endblock %}
{% block scripts %}
  <script src="/static/api.js"></script>
  <script src="/static/auditor.js"></script>
{% endblock %}
